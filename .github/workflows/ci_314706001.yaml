name: ci_314706001   

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Prettier check
        id: prettier
        run: |
          npx prettier --check . || echo "Prettier failed" > prettier_status.txt

      - name: Run tests
        id: tests
        run: |
          npm test -- --coverage | tee test-results.log

      - name: Coverage summary
        id: coverage
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            TOTAL=$(jq '.total.lines.pct' coverage/coverage-summary.json)
            echo "coverage=$TOTAL%" >> $GITHUB_OUTPUT
          else
            echo "coverage=No coverage report" >> $GITHUB_OUTPUT
          fi

      - name: Compute image tag
        id: meta
        run: |
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          [ -z "$BRANCH_NAME" ] && BRANCH_NAME="unknown-branch"

          IMAGE_TAG="sha-${GITHUB_SHA:0:7}"
          [ -z "$IMAGE_TAG" ] && IMAGE_TAG="unknown-tag"

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

          echo "Branch name: $BRANCH_NAME"
          echo "Image tag: $IMAGE_TAG"

      - name: Build Docker image
        run: docker build -t my-app:${{ steps.meta.outputs.image_tag }} .

      - name: Docker image details
        id: docker-image-details
        run: |
          SIZE=$(docker images my-app:${{ steps.meta.outputs.image_tag }} --format "{{.Size}}")
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      - name: Write summary
        if: always()
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY

          # Pipeline result
          OVERALL="Passed"
          if [ -f prettier_status.txt ]; then
            OVERALL="Failed"
          fi
          if grep -q "FAIL" test-results.log; then
            OVERALL="Failed"
          fi
          echo "### Pipeline Result" >> $GITHUB_STEP_SUMMARY
          echo "Overall: $OVERALL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Prettier status
          echo "### Prettier Check" >> $GITHUB_STEP_SUMMARY
          if [ -f prettier_status.txt ]; then
            echo "Result: Failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "Result: Passed" >> $GITHUB_STEP_SUMMARY
          fi

          # Testing result
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          if grep -q "FAIL" test-results.log; then
            FAILED=$(grep -c "FAIL" test-results.log || true)
            PASSED=$(grep -c "PASS" test-results.log || true)
            echo "Result: Failed ($FAILED failed, $PASSED passed)" >> $GITHUB_STEP_SUMMARY
          else
            PASSED=$(grep -c "PASS" test-results.log || true)
            echo "Result: All tests passed ($PASSED total)" >> $GITHUB_STEP_SUMMARY
          fi

          # Coverage
          echo "### Coverage" >> $GITHUB_STEP_SUMMARY
          echo "Overall: ${{ steps.coverage.outputs.coverage }}" >> $GITHUB_STEP_SUMMARY

          # Docker Build Summary
          echo "### Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ steps.meta.outputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Image tag: my-app:${{ steps.meta.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "Size: ${{ steps.docker-image-details.outputs.size }}" >> $GITHUB_STEP_SUMMARY
          echo "Run locally: docker run -it my-app:${{ steps.meta.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
