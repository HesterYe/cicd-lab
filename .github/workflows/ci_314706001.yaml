name: ci_314706001   

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Prettier check
        run: npx prettier --check .

      - name: Run tests
        run: npm test

      - name: Compute image tag
        id: meta
        run: |
          # 在 push event 下 GITHUB_HEAD_REF 通常是空的，要用 GITHUB_REF
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"

          if [[ -z "$BRANCH_NAME" ]]; then
            BRANCH_NAME="unknown-branch"
          fi

          if [[ "$BRANCH_NAME" == release/* ]]; then
            VERSION="${BRANCH_NAME#release/}"
            IMAGE_TAG="release-${VERSION}"
          else
            # 修正 substring 語法，取前 7 碼
            IMAGE_TAG="sha-${GITHUB_SHA:0:7}"
          fi

          if [[ -z "$IMAGE_TAG" ]]; then
            IMAGE_TAG="unknown-tag"
          fi

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

          # Debug 輸出
          echo "Branch name: $BRANCH_NAME"
          echo "Image tag: $IMAGE_TAG"

      - name: Build Docker image
        run: docker build -t my-app:${{ steps.meta.outputs.image_tag }} .

      - name: Write summary
        if: always()
        run: |
          echo "### 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ steps.meta.outputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Image tag: my-app:${{ steps.meta.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- Run locally: \`docker run -it my-app:${{ steps.meta.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
