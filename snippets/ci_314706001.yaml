name: ci_314706001   

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        id: tsc
        run: |
          npx tsc --noEmit 2>&1 | tee tsc.log

      - name: Prettier check
        id: prettier
        run: |
          npx prettier --check . 2>&1 | tee prettier.log

      - name: Run tests
        id: tests
        run: |
          set -o pipefail
          npm test -- --coverage | tee test-results.log

      - name: Compute image tag
        id: meta
        run: |
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          [ -z "$BRANCH_NAME" ] && BRANCH_NAME="unknown-branch"

          IMAGE_TAG="sha-${GITHUB_SHA:0:7}"
          [ -z "$IMAGE_TAG" ] && IMAGE_TAG="unknown-tag"

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t my-app:${{ steps.meta.outputs.image_tag }} .

      - name: Write summary
        if: always()
        run: |
          echo "## 📊 CI Summary" >> $GITHUB_STEP_SUMMARY

          OVERALL="✅ Passed"
          REASON=""

          if [ "${{ steps.tsc.outcome }}" = "failure" ]; then
            OVERALL="❌ Failed"
            REASON="TypeScript 型別檢查失敗"
            echo "### 📝 TypeScript Errors (前 20 行)" >> $GITHUB_STEP_SUMMARY
            head -n 20 tsc.log >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "_完整 log 請查看 Actions Logs_" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.prettier.outcome }}" = "failure" ]; then
            OVERALL="❌ Failed"
            REASON="Prettier 格式檢查失敗"
            echo "### 🎨 Prettier Errors (前 20 行)" >> $GITHUB_STEP_SUMMARY
            head -n 20 prettier.log >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "_完整 log 請查看 Actions Logs_" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.tests.outcome }}" = "failure" ]; then
            OVERALL="❌ Failed"
            REASON="測試失敗"
            echo "### ✅ Test Errors (前 20 行)" >> $GITHUB_STEP_SUMMARY
            head -n 20 test-results.log >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "_完整 log 請查看 Actions Logs_" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### 🚦 Pipeline Result" >> $GITHUB_STEP_SUMMARY
          echo "Overall: $OVERALL" >> $GITHUB_STEP_SUMMARY
          if [ -n "$REASON" ]; then
            echo "原因: $REASON" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ steps.meta.outputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Image tag: my-app:${{ steps.meta.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "Run locally: docker run -it my-app:${{ steps.meta.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
